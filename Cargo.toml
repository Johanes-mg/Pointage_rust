[package]
name = "pointage"
version = "2.2.0"
edition = "2021"
description = "Application de pointage du personnel"
authors = ["Johanes-mg"]

[[bin]]
name = "pointage"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { version = "0.25", features = ["png", "ico"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
rust_xlsxwriter = "0.79"
rfd = "0.14"
directories = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"
